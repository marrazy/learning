<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Library</h1>
    <button id="new-book-btn">Add book</button>
  </header>

  <!-- Your JS will fill this in. The two cards below are just here so you can
       see the styling — delete them once you're rendering from the array. -->
  <main id="library">

    <div class="book-card" data-id="1">
      <h3>The Hobbit</h3>
      <p>by J.R.R. Tolkien</p>
      <p>295 pages</p>
    </div>

    <div class="book-card" data-id="2">
      <h3>Dune</h3>
      <p>by Frank Herbert</p>
      <p>412 pages</p>
    </div>

  </main>

  <!-- Popup form. The <dialog> element gives you a modal for free:
       dialog.showModal() opens it, dialog.close() shuts it. -->
  <dialog id="book-dialog">
    <h2>Add a book</h2>

    <label for="title">Title</label>
    <input type="text" id="title" required>

    <label for="author">Author</label>
    <input type="text" id="author" required>

    <label for="pages">Pages</label>
    <input type="number" id="pages" min="1" required>

    <div class="dialog-buttons">
      <button id="cancel-btn" type="button">Cancel</button>
      <button id="save-btn" type="button">Save</button>
    </div>
  </dialog>

  <!-- <script src="script.js"></script> -->
</body>
</html>
